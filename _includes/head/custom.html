<!-- Google AdSense — Auto ads (사이트 전체).
     애드센스가 발급한 로더 코드. 퍼블리셔 ID 는 ads.txt 의
     pub-8309763910216209 과 일치한다.
     광고 위치·개수는 구글이 자동으로 정하므로 코드로 제어할 수 없다. 개수를
     줄이려면 애드센스 대시보드 > 광고 > 사이트별 설정 > Auto ads 의
     '광고 로드' 를 조절한다. -->
{% if jekyll.environment == "production" %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8309763910216209"
          crossorigin="anonymous"></script>
{% endif %}

<!-- GoatCounter — 방문자 집계. 숫자 표시는 홈 우측 레일의 STATS 섹션에서 한다.
     production 에서만 실행해 로컬 빌드가 조회수를 올리지 않게 한다. -->
{% if jekyll.environment == "production" and site.goatcounter %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
{% endif %}
