# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

# theme                  : "minimal-mistakes-jekyll"
remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "terminal" # "dark" , "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "ko"
title                    : "Redsnow's Anything Blog"
title_separator          : "-"
subtitle                 : "iOS · AI · 개발 노트" # site tagline that appears below site title in masthead
name                     : "JoonHyoung Lee"
description              : "iOS·모바일 앱 개발, AI 소식, 개발 트러블슈팅과 배운 것들을 기록하는 개발 블로그입니다."
url                      : "https://joonhyoung.github.io" # the base hostname & protocol for your site e.g. "https://joonhyoung.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "joonHyoung/joonHyoung.github.io" # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : "/assets/images/og-default.png" # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
# breadcrumbs            : false # true, false (default)
words_per_minute         : 200
comments:
  # 현재 댓글 비활성화. false, "disqus", "discourse", "facebook", "staticman",
  # "staticman_v2", "utterances", "giscus", "custom"
  #
  # Disqus 를 끈 이유: Disqus 위젯은 iframe 이라 사이트 CSS 가 닿지 않아
  # 다크 배경 위에 흰 블록으로 렌더되고, 무료 플랜에서는 Disqus 자체
  # "Sponsored" 광고가 댓글 위에 붙는다. 둘 다 코드로 제어할 수 없다.
  # (_layouts/single.html 이 site.comments.provider 를 보고 분기하므로
  #  이 값이 false 면 댓글 블록 자체가 출력되지 않는다.)
  #
  # 되돌리려면: "disqus" 로 바꾸면 shortname 이 그대로 남아 있어 즉시 복구된다.
  # giscus 로 가려면: 아래 giscus 블록의 TODO 3개를 채우고 "giscus" 로 바꾼다.
  provider               : false
  disqus:
    shortname            : "joonhyoung-github-io" # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
  utterances:
    theme                : # "github-light" (default), "github-dark"
    issue_term           : # "pathname" (default)
  # giscus — GitHub Discussions 기반. 다크 테마 지원, 광고 없음.
  # 아래 TODO 3개를 채우고 위의 provider 를 "giscus" 로 바꾸면 전환된다.
  # 준비 순서:
  #   1) 저장소 Settings > General > Features > Discussions 체크
  #   2) https://github.com/apps/giscus 에서 이 저장소에 giscus 앱 설치
  #   3) https://giscus.app 에 저장소 입력 → repo_id / category / category_id 확인
  # ⚠ 값이 비면 giscus 스크립트가 로드돼도 동작하지 않는다. 채우기 전에 provider 를 바꾸지 말 것.
  # ⚠ 기존 Disqus 댓글은 giscus 로 이전되지 않는다.
  giscus:
    repo_id              : # TODO: giscus.app 에서 확인
    category_name        : # TODO: giscus.app 에서 고른 카테고리 이름 (예: Announcements)
    category_id          : # TODO: giscus.app 에서 확인
    discussion_term      : "pathname" # "pathname" (default), "url", "title", "og:title"
    reactions_enabled    : '1' # '1' for enabled (default), '0' for disabled
    theme                : "transparent_dark" # 다크 배경에 맞춤. "dark", "dark_dimmed" 도 가능
  staticman:
    branch               : # "master"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)
search                   : true # true, false (default)
search_full_content      : true # true, false (default)
search_provider          : lunr # lunr (default), algolia, google
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : # true (default), false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : # false (default), true
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/assets/images/og-default.png" # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : "Person" # Person or Organization (defaults to Person)
  name                   : "이준형" # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles
    - "https://github.com/joonHyoung"

# Analytics
analytics:
  provider               : "google-gtag" # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : "G-R6WK8J8QD8"
    anonymize_ip         : # true, false (default)


